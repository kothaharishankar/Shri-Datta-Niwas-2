    <!-- Theme is applied before paint to avoid a flash of the wrong palette. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sdn-theme-user-choice-v2');
          if (stored === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage can be blocked; the system default is applied by the app */
        }
      })();
    </script>
